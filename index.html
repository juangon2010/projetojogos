<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerHub - Melhores Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🎮 GamerHub</h1>
            <p>Os maiores sucessos exclusivos do PlayStation, Xbox, PC, Switch e Celular</p>
        </div>
    </header>

    <main class="container">
        <!-- Navegação por Categorias Expandida -->
        <nav class="filtro-nav">
            <button class="filtro-btn ativo" data-categoria="todos">Todos</button>
            <button class="filtro-btn" data-categoria="playstation">Playstation</button>
            <button class="filtro-btn" data-categoria="xbox">Xbox</button>
            <button class="filtro-btn" data-categoria="nintendo">Nintendo Switch</button>
            <button class="filtro-btn" data-categoria="computador">Computador</button>
            <button class="filtro-btn" data-categoria="celular">Celular</button>
        </nav>

        <!-- Grade de Jogos -->
        <section class="jogos-grid" id="jogos-container">
            <!-- Os cards serão injetados via JavaScript -->
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 GamerHub - Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
